<!--
Crea una aplicación que sea funcionalmente similar a este proyecto de ejemplo . Intenta no copiar el proyecto de ejemplo, dale tu propio estilo personal.

Objetivo: Cumplir con las historias de usuario que se detallan a continuación y lograr que todas las pruebas se superen para completar el laboratorio.

Historias de usuario:

Deberías tener una !DOCTYPE htmldeclaración.
Debes tener un htmlelemento con langestablecido en en.
Debes tener un headelemento que contenga un titleelemento con el nombre de tu receta y un metaelemento con un charsetatributo establecido en UTF-8.
Deberías tener un bodyelemento.
Debes tener un solo h1elemento con el nombre de tu receta.
Debes tener un pelemento que introduzca la receta debajo del h1.
Debes tener un h2elemento con el texto Ingredientspara la sección de ingredientes.
Debes tener una lista desordenada ( ulelemento) con al menos cuatro elementos de lista ( lielementos) que enumeren tus ingredientes debajo del primer h2elemento.
Debes incluir un segundo h2elemento con el texto Instructionsde la sección de instrucciones.
Debes tener una lista ordenada ( olelemento) con al menos cuatro elementos de lista que enumeren los pasos de la receta en orden, debajo del segundo h2.
Debes tener un imgelemento con un srcatributo configurado con una imagen válida y un altatributo que describa la imagen. Puedes usarlo https://cdn.freecodecamp.org/curriculum/labs/recipe.jpgsi quieres.
Pruebas:
Espera :1. La página de tu receta debe tener una !DOCTYPE htmldeclaración.
Espera :2. Debes tener un htmlelemento con langestablecido en en.
Espera :3. Tu htmlelemento debe tener una etiqueta de cierre. Las etiquetas de cierre tienen una /justo después del <carácter.
Espera :4. Debes tener un headelemento dentro del htmlelemento.
Espera :5. Tu headelemento debe tener una etiqueta de cierre. Las etiquetas de cierre tienen una /justo después del <carácter.
Espera :6. Debes tener un titleelemento dentro de tu headelemento.
Espera :7. Tu titleelemento debe tener una etiqueta de cierre. Las etiquetas de cierre tienen una /justo después del <carácter.
Espera :8. Tu titleelemento debe tener el título de tu receta.
Espera :9. Debes tener un metaelemento dentro de tu headelemento.
Espera :10. Su metaelemento debe tener su charsetatributo establecido en UTF-8.
Espera :11. Debes tener un bodyelemento dentro de tu htmlelemento.
Espera :12. Tu bodyelemento debe tener una etiqueta de cierre. Las etiquetas de cierre tienen una /justo después del <carácter.
Espera :13. Debe tener solo un h1elemento con el nombre de su receta.
Espera :14. Solo debe tener un h1elemento.
Espera :15. Debes tener un pelemento debajo de tu h1elemento.
Espera :16. El primer pelemento debe describir tu receta.
Espera :17. Tu primer h2elemento debe tener el texto Ingredients.
Espera :18. Debes tener un elemento de lista desordenada debajo de tu primer h2elemento.
Espera :19. Debes tener al menos cuatro elementos de lista en tu lista desordenada con los ingredientes.
Espera :20. Tu segundo h2elemento debe tener el texto Instructions.
Espera :21. Deberías tener un elemento de lista ordenada debajo de tu segundo h2elemento.
Espera :22. Debes tener al menos cuatro elementos de lista en tu lista ordenada con las instrucciones.
Espera :23. Debes tener al menos un imgelemento.
Espera :24. Todos tus imgelementos deben tener un srcatributo y un valor válidos.
Espera :25. Todos tus imgelementos deben tener un altatributo para describir la imagen.

-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Fresas</title>
</head>

<body>
    <h1>Fresas</h1>
    <p>Fresas al gusto</p>
    <h2>Ingredients</h2>
    <ul>
        <li>Fresas</li>
        <li>Helado</li>
        <li>Chips</li>
        <li>Galleta</li>
    </ul>
    <h2>Instructions</h2>
    <ol>
        <li>Ingresar Fresas a la Galleta</li>
        <li>Colocar una bola de Helado dentro de la Galleta</li>
        <li>Colocar pequeñas chips encima</li>
        <li>Disfrutar y comer</li>
    </ol>
    <img src="https://cdn.freecodecamp.org/curriculum/labs/recipe.jpg" alt="Huevos">
</body>

</html>
